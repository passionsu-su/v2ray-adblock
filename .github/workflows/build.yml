name: Build v2rayNG AdBlock

on:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "custom/**"
      - "scripts/build.py"
      - "scripts/generate_qr.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2ray-adblock-publish
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QR generator
        run: python -m pip install "qrcode[pil]"
      - name: Build and validate
        run: python scripts/build.py
      - name: Generate artifact QR codes
        run: python scripts/generate_qr.py
      - name: Commit changed outputs only (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # Rebase conflicts are avoided: always regenerate from the newest main.
            git fetch origin main
            git reset --hard origin/main
            python scripts/build.py
            python scripts/generate_qr.py
            git add dist/ qr-codes/ README.md
            if git diff --cached --quiet; then
              echo "No output changes."
              exit 0
            fi
            git commit -m "chore: update v2rayNG adblock rules and QR codes"
            if git push origin HEAD:main; then
              echo "Published outputs successfully."
              exit 0
            fi
            echo "Push raced with another commit; retrying from latest main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "Push failed after five fresh-build attempts" >&2
          exit 1
