name: Build v2rayNG AdBlock

on:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "custom/**"
      - "scripts/build.py"
      - "scripts/generate_qr.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2ray-adblock-publish
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QR generator
        run: python -m pip install "qrcode[pil]"
      - name: Build and validate
        run: python scripts/build.py
      - name: Generate artifact QR codes
        run: python scripts/generate_qr.py
      - name: Commit changed outputs only
        run: |
          git add dist/ qr-codes/ README.md
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update v2rayNG adblock rules and QR codes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Push failed after three rebase attempts" >&2
          exit 1
