name: Build v2rayNG AdBlock

on:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "custom/**"
      - "scripts/build.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize both main-branch and geosite publication workflows.
# Do not cancel a running build; queue competing runs instead.
concurrency:
  group: v2ray-adblock-publish
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate
        run: python scripts/build.py
      - name: Commit changed outputs only
        run: |
          git add dist/ README.md
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update v2rayNG adblock rules"
          git push
